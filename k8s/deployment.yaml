apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-api
  labels:
    app: restaurant-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: restaurant-api
  template:
    metadata:
      labels:
        app: restaurant-api
    spec:
      containers:
        - name: restaurant-api
          image: PLACEHOLDER_IMAGE
          ports:
            - containerPort: 3000
          
          # 🔹 VARIABLES D'ENVIRONNEMENT (Adapté pour SQL/PostgreSQL)
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: restaurant-secrets
                  key: database-url
          
          # 🔹 LIMITES DE RESSOURCES 
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              
          # 🔹 SONDES DE SANTÉ 
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5